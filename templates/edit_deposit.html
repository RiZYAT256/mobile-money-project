{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
        <h1>Edit - {{ Deposit.id }}</h1>

        <div class="container">
            <form method="POST">
               {% csrf_token %}
               {{form|crispy}}
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                    <a href="{% url 'deposit_page' %}" class="btn btn-secondary">Back</a>
                </div>

                {% if message %}
                {{ message }}
                {% endif %}
            </form>
        </div>
{% endblock content %}
